[build-system]
requires = ["hatchling>=1.20.0"]
build-backend = "hatchling.build"

[project]
name = "or-algo"
version = "0.3.1"
description = "A general-purpose algorithm framework for orchestrating solvers"
authors = [{name = "Hermin-Yakovski", email = "hemin.ye@qq.com"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ortools>=9.15.6755",
    "or-register>=0.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.10",
    "pytest-cov>=7.1.0",
]

[tool.uv.sources]
or-register = { index = "testpypi" }

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["or_algo"]

[tool.coverage.run]
source = ["or_algo"]

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing --cov-report=html"

[tool.ruff]
exclude = ["tests", "docs", "README.md"]
line-length = 100
target-version = "py311"

[tool.mypy]
exclude = ["tests/"]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "ortools.*"
ignore_missing_imports = true
